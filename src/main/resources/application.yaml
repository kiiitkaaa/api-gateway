server:
  port: 8090

spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${downstream.auth.url}
              predicates:
                - Path=/api/v1/auth/login, /api/v1/auth/refresh
            - id: user-service
              uri: ${downstream.user.url}
              predicates:
                - Path=/api/v1/users/**, /api/v1/cards/**
            - id: order-service
              uri: ${downstream.order.url}
              predicates:
                - Path=/api/v1/orders/**, /api/v1/items/**

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true