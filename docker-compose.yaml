services:
  user-db:
    image: postgres:16-alpine
    container_name: user-service-postgres
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USERNAME}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: user-service-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

  user-service:
    build: ./user-service
    image: user-service:latest
    container_name: user-service-app
    depends_on:
      - user-db
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DOCKER_DB_NAME: ${USER_DB_NAME}
      DOCKER_DB_USERNAME: ${USER_DB_USERNAME}
      DOCKER_DB_PASSWORD: ${USER_DB_PASSWORD}
      DOCKER_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/${USER_DB_NAME}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    restart: unless-stopped

  auth-db:
    image: postgres:16-alpine
    container_name: auth-service-postgres
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USERNAME}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  auth-service:
    build: ./auth-service
    image: auth-service:latest
    container_name: auth-service-app
    depends_on:
      - auth-db
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DOCKER_DB_NAME: ${AUTH_DB_NAME}
      DOCKER_DB_USERNAME: ${AUTH_DB_USERNAME}
      DOCKER_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/${AUTH_DB_NAME}
    restart: unless-stopped

  order-db:
    image: postgres:16-alpine
    container_name: order-service-postgres
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${ORDER_DB_USERNAME}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data

  order-service:
    build: ./order-service
    image: order-service:latest
    container_name: order-service-app
    depends_on:
      - order-db
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DOCKER_DB_NAME: ${ORDER_DB_NAME}
      DOCKER_DB_USERNAME: ${ORDER_DB_USERNAME}
      DOCKER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      USER_SERVICE_URL: http://user-service:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/${ORDER_DB_NAME}
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    image: api-gateway:latest
    container_name: api-gateway
    depends_on:
      - auth-service
      - user-service
      - order-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL_DOCKER: http://auth-service:8081
      USER_SERVICE_URL_DOCKER: http://user-service:8080
      ORDER_SERVICE_URL_DOCKER: http://order-service:8082
    ports:
      - "8090:8090"
    restart: unless-stopped

volumes:
  user-db-data:
  auth-db-data:
  order-db-data:
  redis-data:
